name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk tykva.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tykva-apk
          path: tykva.apk
          retention-days: 14
